apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webapp-api
  name: webapp-api
  namespace: webapp-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-api
  strategy: {}
  template:
    metadata:
      labels:
        app: webapp-api
    spec:
      containers:
      - image: webapp-api:task2
        name: webapp-api
        resources: {}

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

        envFrom:
        - configMapRef:
            name: webapp-config
